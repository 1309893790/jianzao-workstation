  --glow-primary: 0 5px 18px rgba(107,92,224,0.30);
  /* 极淡光晕（克制） */
  --blob-1: radial-gradient(58% 58% at 8% -6%, rgba(139,111,224,0.28), transparent 66%);
  --blob-2: radial-gradient(50% 50% at 102% 8%, rgba(75,127,216,0.22), transparent 66%);
  --blob-3: radial-gradient(52% 52% at 94% 98%, rgba(224,106,155,0.18), transparent 66%);
}

/* ===== 暗夜紫（夜间）===== */
.theme-dark {
  --bg: #0F0D1B;
  --bg-sidebar: rgba(32,30,64,0.88);
  --bg-header: rgba(28,26,56,0.55);
  --surface: rgba(60,54,118,0.42);
  --surface-strong: rgba(66,60,128,0.58);
  --surface-muted: rgba(74,66,138,0.28);
  --text: #E9E7F6;
  --text-muted: #A29EC4;
  --text-on-sidebar: #ECEAF8;
  --text-on-sidebar-muted: rgba(236,234,248,0.56);
  --border: rgba(255,255,255,0.11);
  --border-light: rgba(255,255,255,0.30);
  --border-sidebar: rgba(255,255,255,0.10);
  --brand: #8E80F2;
  --brand-deep: #6E60DE;
  --brand-soft: rgba(142,128,242,0.15);
  --brand-soft-strong: rgba(142,128,242,0.24);
  --brand-text: #BDB1FF;
  --success: #3FCB8C; --success-soft: rgba(63,203,140,0.16);
  --warning: #EDA64E; --warning-soft: rgba(237,166,78,0.16);
  --danger: #F2626B; --danger-soft: rgba(242,98,107,0.16);
  --info: #6C9CF0; --info-soft: rgba(108,156,240,0.16);
  --pink: #EE8BB4; --pink-soft: rgba(238,139,180,0.16);
  --purple: #B79CE8; --purple-soft: rgba(183,156,232,0.16);
  --orange: #EDAA72; --orange-soft: rgba(237,170,114,0.16);
  --teal: #48C9C0; --teal-soft: rgba(72,201,192,0.16);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.35), 0 10px 30px rgba(0,0,0,0.30);
  --shadow-md: 0 6px 18px rgba(0,0,0,0.45), 0 26px 60px rgba(0,0,0,0.40);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.55), 0 44px 100px rgba(0,0,0,0.55);
  --ring: 0 0 0 3px rgba(142,128,242,0.26);
  --glow-primary: 0 5px 18px rgba(142,128,242,0.34);
  --blob-1: radial-gradient(58% 58% at 8% -6%, rgba(142,108,255,0.32), transparent 66%);
  --blob-2: radial-gradient(50% 50% at 102% 8%, rgba(108,140,255,0.24), transparent 66%);
  --blob-3: radial-gradient(52% 52% at 94% 98%, rgba(160,130,255,0.24), transparent 66%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  color: var(--text);
  height: 100vh; overflow: hidden;
  background-color: var(--bg);
  background-image: var(--blob-1), var(--blob-2), var(--blob-3);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ===== 磨砂玻璃基类 ===== */
.glass {
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border: 1px solid var(--border-light);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 24px rgba(255,255,255,0.26), var(--shadow-sm);
}

.app { display: flex; height: 100vh; }

/* ---- 侧边栏：深紫磨砂（品牌，商务） ---- */
.sidebar {
  width: var(--sidebar-width);
  display: flex; flex-direction: column; flex-shrink: 0;
  background: var(--bg-sidebar);
  color: var(--text-on-sidebar);
  -webkit-backdrop-filter: blur(26px) saturate(160%);
  backdrop-filter: blur(26px) saturate(160%);
  border-right: 1px solid var(--border-sidebar);
}
/* 侧边栏收起（隐藏侧栏，主内容区自动占满） */
.sidebar-collapsed .sidebar { display: none; }
.sidebar-header { padding: 20px 18px 18px; border-bottom: 1px solid var(--border-sidebar); }
.sidebar-header .logo-row { display: flex; align-items: center; gap: 12px; }
.sidebar-header .logo-badge {
  width: 38px; height: 38px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
  background: var(--brand); color: #fff; border-radius: 3px;
  box-shadow: 0 4px 14px rgba(107,92,224,0.35);
}
.sidebar-header h1 { font-size: 15px; font-weight: 700; color: var(--text-on-sidebar); letter-spacing: 0.3px; line-height: 1.2; }
.sidebar-header p { font-size: 10.5px; color: var(--text-on-sidebar-muted); margin-top: 3px; letter-spacing: 0.4px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; cursor: pointer;
  font-size: 14px; color: var(--text-on-sidebar-muted); font-weight: 500;
  border: none; background: transparent; width: 100%; text-align: left;
  border-radius: 3px; position: relative;
  transition: background 0.16s ease-out, color 0.16s ease-out;
}
.nav-item:hover { background: rgba(255,255,255,0.08); color: var(--text-on-sidebar); }
.nav-item.active { background: rgba(255,255,255,0.14); color: var(--text-on-sidebar); font-weight: 600; }
.nav-item.active::before { content: ''; position: absolute; left: -12px; top: 22%; bottom: 22%; width: 3px; background: var(--brand-2, #9B8BF2); }
.nav-item .icon { font-size: 16px; width: 22px; text-align: center; }
.nav-item .nav-badge {
  margin-left: auto; min-width: 18px; height: 18px; padding: 0 6px;
  background: var(--danger); color: #fff; border-radius: var(--radius-pill);
  font-size: 10.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}
.sidebar-footer { padding: 14px; border-top: 1px solid var(--border-sidebar); display: flex; flex-direction: column; gap: 10px; }
.btn-folder {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.16);
  border-radius: 3px; cursor: pointer;
  font-size: 12.5px; font-weight: 600; color: var(--text-on-sidebar); width: 100%;
  transition: all 0.16s ease-out;
}
.btn-folder:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.30); }
.folder-status { font-size: 10px; color: var(--text-on-sidebar-muted); word-break: break-all; line-height: 1.6; text-align: center; }
.theme-toggle {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 12px; cursor: pointer;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 3px; font-size: 12.5px; color: var(--text-on-sidebar-muted); width: 100%;
  transition: all 0.16s ease-out;
}
.theme-toggle:hover { background: rgba(255,255,255,0.14); color: var(--text-on-sidebar); }

/* ---- 主头部：磨砂玻璃 ---- */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.main-header {
  height: var(--header-height); padding: 0 28px;
  display: flex; align-items: center; gap: 20px;
  background: var(--bg-header);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border-bottom: 1px solid var(--border-light);
  box-shadow: inset 0 -1px 0 var(--border-light), 0 2px 10px rgba(46,40,90,0.04);
  flex-shrink: 0;
}
.main-header .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex-shrink: 0; }
.main-header h2 { font-size: 17px; font-weight: 700; letter-spacing: 0.2px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; }
.main-header h2::before { content: ''; width: 3px; height: 16px; background: var(--brand); flex-shrink: 0; }
.main-header .header-search {
  flex: 1; max-width: 460px;
  display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 16px;
  background: var(--surface-muted); border: 1px solid var(--border-light);
  border-radius: var(--radius-pill); font-size: 13px; color: var(--text-muted);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.main-header .header-search:focus-within { border-color: var(--brand); box-shadow: var(--ring); background: var(--surface-strong); }
.main-header .header-search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 13px; padding: 0; box-shadow: none; }
.main-header .header-search input::placeholder { color: var(--text-muted); }
/* 全局搜索定位高亮：命中行闪烁黄色 2.6s 后恢复 */
@keyframes searchFlashBg {
  0%, 60% { background-color: #fff3bf !important; outline: 2px solid #F59E0B; outline-offset: -2px; }
  100% { background-color: transparent; outline: 0; }
}
.search-highlight { animation: searchFlashBg 2.6s ease; }
.search-highlight td { animation: searchFlashBg 2.6s ease; }
.main-header .header-search .search-icon { color: var(--text-muted); font-size: 14px; }
.main-header .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.main-header .header-theme-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 16px;
  background: var(--surface); border: 1px solid var(--border-light);
  border-radius: var(--radius-pill); cursor: pointer;
  font-size: 13px; font-weight: 500; color: var(--text);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 24px rgba(255,255,255,0.26), var(--shadow-sm);
  transition: all 0.16s ease-out;
}
.main-header .header-theme-btn:hover { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.main-header .header-theme-btn:active { transform: translateY(1px); }

.content { flex: 1; overflow-y: auto; padding: 26px 28px 40px; }
.module { display: none; }
.module.active { display: block; animation: moduleIn 0.3s cubic-bezier(0.16,1,0.3,1); }
@keyframes moduleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---- 卡片：磨砂玻璃 ---- */
.card {
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border: 1px solid var(--border-light);
  border-radius: var(--radius-card);
  padding: 20px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 24px rgba(255,255,255,0.26), var(--shadow-sm);
}
.card-title {
  font-size: 14px; font-weight: 700; color: var(--text);
  margin-bottom: 14px; letter-spacing: 0.1px;
  display: flex; align-items: center; justify-content: space-between;
}
.card-title .actions { display: flex; gap: 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border-radius: 3px;
  border: 1px solid var(--border-light); background: var(--surface-strong);
  font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 24px rgba(255,255,255,0.26), var(--shadow-sm);
  transition: all 0.16s ease-out;
}
.btn:hover { background: var(--surface); box-shadow: inset 0 1px 0 var(--border-light), var(--shadow-md); }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--brand); color: var(--brand-on); border-color: transparent;
  box-shadow: var(--glow-primary), inset 0 1px 0 rgba(255,255,255,0.22);
}
.btn-primary:hover { background: var(--brand-deep); box-shadow: 0 7px 22px rgba(107,92,224,0.38), inset 0 1px 0 rgba(255,255,255,0.22); }
.btn-success {
  background: var(--success); color: #fff; border-color: transparent;
  box-shadow: 0 5px 18px rgba(18,154,99,0.30), inset 0 1px 0 rgba(255,255,255,0.22);
}
.btn-success:hover { background: #0E7F52; }
.btn-sm { padding: 7px 14px; font-size: 12.5px; }

input, textarea, select {
  font-family: var(--font-sans); font-size: 14px;
  padding: 9px 13px;
  border: 1px solid var(--border); border-radius: 3px;
  background: var(--surface); color: var(--text); outline: none;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: inset 0 1px 2px rgba(46,40,90,0.04);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--brand); box-shadow: var(--ring); }
input::placeholder, textarea::placeholder { color: var(--text-muted); opacity: 0.75; }
input[type="number"] { width: 84px; text-align: center; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
table th {
  background: var(--surface-muted);
  padding: 9px 11px; text-align: left; font-weight: 600;
  color: var(--text-muted); border-bottom: 1px solid var(--border);
  letter-spacing: 0.3px; white-space: nowrap;
}
table td { padding: 9px 11px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
table td input, table td select { width: 100%; border: none; padding: 3px 6px; background: transparent; box-shadow: none; }
table td input:focus { background: var(--brand-soft); border: 1px solid var(--brand); box-shadow: none; }
table tbody tr { transition: background 0.12s; }
table tbody tr:hover { background: var(--brand-soft); }
table tbody tr:nth-child(even) { background: rgba(107,92,224,0.05); }
.theme-dark table tbody tr:nth-child(even) { background: rgba(255,255,255,0.03); }

.section-header {
  font-size: 13px; font-weight: 700; letter-spacing: 0.6px;
  padding: 8px 16px;
  background: var(--brand); color: var(--brand-on); border-radius: 3px; margin-bottom: 12px;
  display: inline-block;
  box-shadow: 0 4px 14px rgba(107,92,224,0.24);
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; } .mt-12 { margin-top: 12px; }
.flex { display: flex; } .flex-center { align-items: center; }
.gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
.text-muted { color: var(--text-muted); } .text-sm { font-size: 12px; } .text-xs { font-size: 11.5px; }

/* ---- KPI 卡：磨砂玻璃 + 彩色 icon 圆 ---- */
.kpi { font-size: 24px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
.kpi-label { font-size: 12px; color: var(--text-muted); margin-top: 5px; letter-spacing: 0.3px; }
.kpi-card {
  position: relative; overflow: hidden;
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border: 1px solid var(--border-light); border-radius: var(--radius-card);
  padding: 14px 16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), var(--shadow-sm);
  transition: transform 0.18s ease-out, box-shadow 0.18s ease-out;
}
.kpi-card:hover { transform: translateY(-3px); box-shadow: inset 0 1px 0 var(--border-light), var(--shadow-md); }
.kpi-card .kpi-icon {
  width: 44px; height: 44px; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 21px; margin-bottom: 14px;
}
.kpi-card .kpi-icon.blue   { background: var(--info-soft);    color: var(--info); }
.kpi-card .kpi-icon.pink   { background: var(--pink-soft);    color: var(--pink); }
.kpi-card .kpi-icon.green  { background: var(--success-soft); color: var(--success); }
.kpi-card .kpi-icon.purple { background: var(--purple-soft);  color: var(--purple); }
.kpi-card .kpi-icon.orange { background: var(--orange-soft);  color: var(--orange); }
.kpi-card .kpi-icon.teal   { background: var(--teal-soft);    color: var(--teal); }
.kpi-card.brand {
  background: linear-gradient(135deg, var(--brand), var(--brand-deep));
  border: none; color: #fff;
  box-shadow: 0 10px 28px rgba(107,92,224,0.30);
}
.kpi-card.brand .kpi, .kpi-card.brand .kpi-label { color: #fff; }
.kpi-card.brand .kpi-label { opacity: 0.82; }

.tag { display: inline-block; padding: 3px 11px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 600; }
.tag-success { background: var(--success-soft); color: var(--success); }
.tag-warning { background: var(--warning-soft); color: var(--warning); }
.tag-danger { background: var(--danger-soft); color: var(--danger); }

/* ---- 照片区 ---- */
.photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 12px; }
.photo-card {
  border: 1px solid var(--border-light); border-radius: var(--radius-card); padding: 18px 14px;
  text-align: center; cursor: pointer;
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 24px rgba(255,255,255,0.26), var(--shadow-sm);
  transition: all 0.18s ease-out;
}
.photo-card:hover { border-color: var(--brand); transform: translateY(-3px); box-shadow: inset 0 1px 0 var(--border-light), var(--shadow-md); }
.photo-card .photo-icon { font-size: 26px; margin-bottom: 6px; }
.photo-card .photo-label { font-size: 12.5px; font-weight: 600; }
.photo-card .photo-count { font-size: 10.5px; color: var(--text-muted); margin-top: 3px; }
.photo-card .photo-thumbs { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.photo-card .photo-thumbs img { width: 54px; height: 54px; object-fit: cover; border-radius: 3px; border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); }
.photo-card.has-photos { border-color: var(--brand); background: var(--brand-soft); }
.photo-card .upload-btn {
  display: inline-block; padding: 6px 16px; margin-top: 10px; font-size: 11.5px; font-weight: 600;
  background: var(--brand); color: #fff; border-radius: 3px; cursor: pointer;
  box-shadow: 0 4px 12px rgba(107,92,224,0.28);
  transition: opacity 0.15s, transform 0.15s;
}
.photo-card .upload-btn:hover { opacity: 0.88; transform: translateY(-1px); }

.summary-strip {
  display: flex; gap: 24px; padding: 14px 22px;
  background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-card);
  margin-bottom: 16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 24px rgba(255,255,255,0.26), var(--shadow-sm);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
}
.summary-strip .item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.summary-strip .item .num { font-weight: 700; font-size: 15.5px; font-variant-numeric: tabular-nums; color: var(--brand); }

.report-actions { display: flex; gap: 8px; margin-bottom: 16px; }

.empty-state { text-align: center; padding: 56px 24px; color: var(--text-muted); }
.empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.85; }
.empty-state p { font-size: 13.5px; line-height: 1.8; }

/* ---- 弹窗：深磨砂 ---- */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(16,12,32,0.55);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  z-index: 100; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; animation: fadeIn 0.2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface-strong);
  -webkit-backdrop-filter: blur(40px) saturate(var(--glass-sat));
  backdrop-filter: blur(40px) saturate(var(--glass-sat));
  border: 1px solid var(--border-light); border-radius: 6px; padding: 28px;
  max-width: 620px; width: 92%; max-height: 86vh; overflow-y: auto;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 0 40px rgba(255,255,255,0.18), var(--shadow-lg);
  animation: modalUp 0.28s cubic-bezier(0.16,1,0.3,1);
}
@keyframes modalUp { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }
.modal-wide { max-width: 94vw !important; width: 94vw !important; max-height: 94vh !important; }
.modal h3 { font-size: 16px; margin-bottom: 16px; font-weight: 700; letter-spacing: 0.2px; }

.date-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.date-nav .date-label { font-size: 15px; font-weight: 700; }
.date-nav .week-label { font-size: 12px; color: var(--brand); font-weight: 600; }
.date-nav .nav-btn {
  cursor: pointer; padding: 7px 13px; border-radius: 3px;
  border: 1px solid var(--border-light); background: var(--surface);
  font-size: 13.5px; color: var(--text);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 24px rgba(255,255,255,0.26), var(--shadow-sm);
  transition: all 0.15s ease-out;
}
.date-nav .nav-btn:hover { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

.config-form label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 3px; font-weight: 500; }
.config-form input { width: 100%; }
.config-form .field-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(107,92,224,0.22); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(107,92,224,0.40); background-clip: padding-box; }

.daily-calendar {
  position: absolute; z-index: 60;
  background: var(--surface-strong); border: 1px solid var(--border-light); border-radius: 6px;
  box-shadow: inset 0 1px 0 var(--border-light), var(--shadow-lg); padding: 14px;
  -webkit-backdrop-filter: blur(24px) saturate(var(--glass-sat));
  backdrop-filter: blur(24px) saturate(var(--glass-sat));

.daily-calendar .cal-grid { display: grid; grid-template-columns: repeat(7, 36px); gap: 4px; }
.daily-calendar .cal-cell {
  width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
  border-radius: 3px; font-size: 12.5px; cursor: pointer;
  border: none; background: transparent; color: var(--text);
  transition: background 0.12s;
}
.daily-calendar .cal-cell:hover { background: var(--brand-soft); }
.daily-calendar .cal-cell.saved { background: var(--success-soft); color: var(--success); font-weight: 600; }
.daily-calendar .cal-cell.today { box-shadow: inset 0 0 0 1.5px var(--warning); }
.daily-calendar .cal-cell.selected { background: var(--brand); color: #fff; font-weight: 700; box-shadow: 0 3px 10px rgba(107,92,224,0.4); }
.daily-calendar .cal-cell.dim { color: var(--text-muted); opacity: 0.55; }

.upload-zone { transition: box-shadow 0.16s ease-out, border-color 0.16s ease-out, transform 0.16s ease-out; }
.drag-over { border-color: var(--brand) !important; box-shadow: var(--ring), var(--shadow-md) !important; transform: scale(1.01); }

.photo-del {

  border-radius: 50%; border: 2px solid var(--surface-strong);
  background: linear-gradient(135deg, #F2626B, #E04A52);
  color: #fff; font-size: 11px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3); z-index: 2;
  transition: transform 0.12s;

.photo-del:hover { transform: scale(1.15); }
.photo-thumbs .thumb-wrap { position: relative; display: inline-block; }

.update-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--border-sidebar); }
.version-tag { font-size: 10.5px; color: var(--text-on-sidebar-muted); cursor: pointer; padding: 3px 9px; border-radius: 3px; background: rgba(255,255,255,0.06); }
.version-tag:hover { background: rgba(255,255,255,0.16); color: var(--text-on-sidebar); }
.btn-update { font-size: 10.5px; padding: 3px 10px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: var(--text-on-sidebar-muted); cursor: pointer; }
.btn-update:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.30); color: var(--text-on-sidebar); }

.wm-preview, .wrep-pv, .daily-preview-body { background: #FFFFFF; color: #222; }
.theme-dark .wm-preview, .theme-dark .wrep-pv { background: #FFFFFF; color: #222; }

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
